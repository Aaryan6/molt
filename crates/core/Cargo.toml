[package]
name = "molt-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell"] }
