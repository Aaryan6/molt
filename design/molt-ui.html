<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molt · UI design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f12; --card: #15161a; --card-2: #1c1d22; --hover: #1a1b20; --line: #24262c;
  --fg: #f3f3f5; --fg-2: #a3a5ad; --fg-3: #6c6f78;
  --accent: #8b7cf6; --accent-soft: rgba(139, 124, 246, .14);
  --danger: #f2555a; --seg-other: #34363d;
  --k-deps: #8b7cf6; --k-next: #d4d5db; --k-build: #4cc3f0; --k-py: #f5b54a; --k-rust: #f47c8c;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f6f8; --card: #ffffff; --card-2: #f1f1f4; --hover: #f7f7fa; --line: #e6e6eb;
    --fg: #15161a; --fg-2: #5e616a; --fg-3: #9a9ca5;
    --accent: #6d5ce8; --accent-soft: rgba(109, 92, 232, .1);
    --danger: #e5484d; --seg-other: #d9dae0; --k-next: #55575f;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font: 13px/1.5 var(--sans); font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
@media (min-width: 1000px) {
  body { background: #08090b; padding: 40px 0; }
}
@media (min-width: 1000px) and (prefers-color-scheme: light) { body { background: #e8e8ed; } }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.mono { font-family: var(--mono); font-size: 11px; }
svg { display: block; flex: none; }

.window { position: relative; width: 960px; margin: 0 auto; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
@media (min-width: 1000px) { .window { box-shadow: 0 30px 80px rgba(0, 0, 0, .35); } }
@media (max-width: 999px) { .window { zoom: .758; } }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 18px 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; letter-spacing: -.01em; margin-right: auto; }
.mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid #fff; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--fg-2); cursor: pointer; font-size: 12.5px; }
.chip-btn:hover { color: var(--fg); }
.chip-btn .path { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--card-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary:hover:not(:disabled) { background: var(--fg); opacity: .9; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { background: var(--danger); filter: brightness(1.08); }
.progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; overflow: hidden; }
.progress i { display: block; width: 30%; height: 100%; background: var(--accent); animation: slide 1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

/* overview cards */
.overview { display: grid; grid-template-columns: 1.05fr 1.35fr 1fr; gap: 12px; padding: 0 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card-h { display: flex; justify-content: space-between; align-items: center; color: var(--fg-2); font-size: 12.5px; font-weight: 500; }
.card-h .tag { font-size: 11.5px; color: var(--fg-3); font-weight: 400; }
.big { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; margin-top: 12px; }
.big small { font-size: 15px; font-weight: 500; color: var(--fg-2); margin-left: 3px; letter-spacing: 0; }
.sub { color: var(--fg-3); font-size: 12px; margin-top: 3px; }

.disk-body { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg circle { transition: stroke-dasharray .6s ease, stroke-dashoffset .6s ease; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.ring .center span { font-size: 11px; color: var(--fg-3); }
.legend-v { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; flex: 1; min-width: 0; }
.legend-v li { display: grid; grid-template-columns: 8px 1fr; gap: 1px 8px; align-items: center; font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
.legend-v b { grid-column: 2; color: var(--fg); font-weight: 600; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.segbar { display: flex; gap: 3px; height: 10px; margin-top: 16px; }
.segbar i { height: 100%; border-radius: 3px; transition: flex-grow .5s ease; min-width: 3px; }
.legend-g { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin-top: 14px; }
.legend-g div { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.legend-g b { color: var(--fg); font-weight: 500; }

.hist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 70px; margin-top: 14px; }
.hist .col { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.hist .bar { width: 100%; border-radius: 5px 5px 2px 2px; background: var(--seg-other); transition: height .5s ease; min-height: 3px; }
.hist .bar.idle { background: var(--accent); }
.hist .lbl { font-size: 10.5px; color: var(--fg-3); }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 500; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* list */
.list-card { margin: 12px 22px 22px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 12px 12px; border-bottom: 1px solid var(--line); }
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--card-2); border-radius: 10px; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 5px 11px; border-radius: 7px; color: var(--fg-2); cursor: pointer; font-size: 12.5px; font-weight: 500; }
.tab:hover { color: var(--fg); }
.tab .n { font-size: 11px; color: var(--fg-3); font-weight: 400; }
.tab.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 0 0 1px var(--line); }
.sort { display: flex; gap: 14px; font-size: 12px; }
.sort button { border: 0; background: none; padding: 0; color: var(--fg-3); cursor: pointer; font-weight: 500; }
.sort button.on { color: var(--fg); }

.cols, .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 128px 150px 64px 74px; gap: 16px; align-items: center; padding: 0 18px; }
.cols { height: 36px; font-size: 11.5px; color: var(--fg-3); font-weight: 500; border-bottom: 1px solid var(--line); }
.cols .r, .row .r { text-align: right; }
.rows { height: 296px; overflow: auto; }
.row { height: 56px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.name { min-width: 0; }
.name b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name .mono { display: block; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.kind { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--card-2); font: 11px var(--mono); color: var(--fg-2); max-width: 100%; overflow: hidden; white-space: nowrap; }
.kind .dot { flex: none; }
.meter { height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.age { font-size: 12px; color: var(--fg-3); }
.age.old { color: var(--fg-2); }
.size { font-weight: 600; font-size: 13px; }
.empty { padding: 90px 0; text-align: center; color: var(--fg-3); }

.list-foot { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-top: 1px solid var(--line); }
.list-foot .info { margin-right: auto; color: var(--fg-2); }
.list-foot .info b { color: var(--fg); font-weight: 600; }

input[type="checkbox"] { appearance: none; width: 17px; height: 17px; margin: 0; border: 1.5px solid var(--fg-3); border-radius: 5px; display: grid; place-items: center; cursor: pointer; background: none; transition: background .12s, border-color .12s; }
input[type="checkbox"]:checked, input[type="checkbox"]:indeterminate { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
input[type="checkbox"]:indeterminate::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 1px; }

/* dialog + toast */
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); display: grid; place-items: center; z-index: 5; backdrop-filter: blur(2px); }
.dialog { width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; box-shadow: 0 30px 60px rgba(0, 0, 0, .4); }
.dialog h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.dialog p { margin: 0; color: var(--fg-2); }
.dialog .free { display: flex; align-items: baseline; gap: 6px; margin: 16px 0 4px; padding: 14px; border-radius: 10px; background: var(--card-2); }
.dialog .free b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.dialog .free span { color: var(--fg-3); font-size: 12px; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 500; white-space: nowrap; z-index: 6; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
</style>
</head>
<body>
<div class="window" id="win">
  <div class="progress" id="progress" hidden><i></i></div>

  <header class="top">
    <div class="brand"><span class="mark"></span>Molt</div>
    <button class="chip-btn" id="folder" title="Change folder">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="path">D:\code</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="btn primary" id="scan">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
      <span id="scan-label">Scan</span>
    </button>
  </header>

  <section class="overview">
    <div class="card">
      <div class="card-h"><span>Disk D:</span><span class="tag">476 GB</span></div>
      <div class="disk-body">
        <div class="ring" id="ring"></div>
        <ul class="legend-v" id="disk-legend"></ul>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><span>Reclaimable</span><span class="tag" id="recl-tag"></span></div>
      <div class="big num" id="recl"></div>
      <div class="segbar" id="segbar"></div>
      <div class="legend-g" id="kind-legend"></div>
    </div>

    <div class="card">
      <div class="card-h"><span>Untouched projects</span><button class="link" id="sel-idle">Select</button></div>
      <div class="big num" id="idle"></div>
      <div class="sub">idle for 30+ days</div>
      <div class="hist" id="hist"></div>
    </div>
  </section>

  <section class="list-card">
    <div class="list-top">
      <div class="tabs" id="tabs"></div>
      <div class="sort" id="sort"></div>
    </div>
    <div class="cols">
      <input type="checkbox" id="all" aria-label="Select all">
      <span>Folder</span><span>Type</span><span>Share of total</span><span>Edited</span><span class="r">Size</span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="list-foot">
      <span class="info" id="info"></span>
      <button class="btn danger" id="delete" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        Delete
      </button>
    </div>
  </section>

  <div class="scrim" id="confirm" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="c-title">
      <h2 id="c-title"></h2>
      <p id="c-body"></p>
      <div class="free"><b class="num" id="c-size"></b><span>will be freed</span></div>
      <div class="actions">
        <button class="btn" id="c-cancel">Cancel</button>
        <button class="btn danger" id="c-ok">Delete permanently</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
const GB = 1024 ** 3, MB = 1024 ** 2;
const ROOT = "D:\\code";
const DISK = { total: 476 * GB, free: 91.2 * GB };

const GROUPS = [
  { id: "deps", label: "node_modules", kinds: ["node_modules"], color: "var(--k-deps)" },
  { id: "next", label: ".next", kinds: [".next"], color: "var(--k-next)" },
  { id: "rust", label: "Rust target", kinds: ["target"], color: "var(--k-rust)" },
  { id: "py", label: "Python", kinds: [".venv", "__pycache__"], color: "var(--k-py)" },
  { id: "build", label: "Builds", kinds: ["dist", "build", "out", ".turbo"], color: "var(--k-build)" },
];
const groupOf = (kind) => GROUPS.find((g) => g.kinds.includes(kind));
const RECREATE = { deps: "npm install", next: "a rebuild", build: "a rebuild", py: "pip install", rust: "cargo build" };

// Made-up sample data.
// [project, path under root, folder, size, days since the project was last edited]
const DATA = [
  ["storefront", "work\\storefront", "node_modules", 2.0 * GB, 0],
  ["molt", "molt", "target", 1.6 * GB, 0],
  ["admin-panel", "work\\admin-panel", "node_modules", 1.1 * GB, 7],
  ["photo-search", "ai\\photo-search", ".venv", 1.0 * GB, 3],
  ["habit-tracker", "apps\\habit-tracker", "node_modules", 996.7 * MB, 7],
  ["chat-prototype", "work\\chat-prototype", "node_modules", 701.7 * MB, 2],
  ["dashboard-fe", "work\\dashboard\\dashboard-fe", "node_modules", 604.1 * MB, 5],
  ["chat-prototype", "work\\chat-prototype", ".next", 593.7 * MB, 2],
  ["landing", "work\\landing", "node_modules", 546.6 * MB, 8],
  ["video-studio", "media\\video-studio", "node_modules", 536.8 * MB, 1],
  ["kanban", "apps\\kanban", "node_modules", 514.8 * MB, 25],
  ["video-studio", "media\\video-studio", ".next", 484.2 * MB, 1],
  ["stock-ticker", "course\\apps\\stock-ticker", "node_modules", 464.3 * MB, 34],
  ["persona-chat", "course\\apps\\persona-chat", "node_modules", 437.6 * MB, 41],
  ["docs-site", "course\\docs-site", "node_modules", 434.8 * MB, 2],
  ["agent-demo", "demos\\agent-demo", "node_modules", 428.7 * MB, 5],
  ["portfolio-2023", "portfolios\\portfolio-2023", "node_modules", 388 * MB, 214],
  ["blog", "nextjs13\\blog", "node_modules", 341 * MB, 296],
  ["dashboard-be", "work\\dashboard\\dashboard-be", "node_modules", 303.1 * MB, 5],
  ["docs-site", "course\\docs-site", ".next", 298.8 * MB, 2],
  ["mern-shop", "mern\\mern-shop\\client", "node_modules", 296 * MB, 402],
  ["habit-tracker", "apps\\habit-tracker\\apps\\web", "node_modules", 278.6 * MB, 7],
  ["link-checker", "extensions\\link-checker", "node_modules", 252.8 * MB, 63],
  ["agent-demo", "demos\\agent-demo", ".next", 210.8 * MB, 5],
  ["dashboard-fe", "work\\dashboard\\dashboard-fe", ".next", 188 * MB, 5],
  ["kanban", "apps\\kanban", ".next", 142 * MB, 25],
  ["portfolio-2023", "portfolios\\portfolio-2023", ".next", 126 * MB, 214],
  ["mern-shop", "mern\\mern-shop\\server", "node_modules", 118 * MB, 402],
  ["blog", "nextjs13\\blog", ".next", 97 * MB, 296],
  ["link-checker", "extensions\\link-checker", "dist", 64 * MB, 63],
  ["habit-tracker", "apps\\habit-tracker", ".turbo", 64 * MB, 7],
  ["mern-shop", "mern\\mern-shop\\client", "build", 22 * MB, 402],
  ["photo-search", "ai\\photo-search", "__pycache__", 18 * MB, 3],
  ["tab-saver", "extensions\\tab-saver", "dist", 12 * MB, 180],
];
const load = () => DATA.map(([project, rel, kind, size, age]) => ({
  project, kind, age, size: Math.round(size), group: groupOf(kind), path: `${ROOT}\\${rel}\\${kind}`,
}));

let items = load();
const S = { tab: "all", sort: "size", sel: new Set(), scanning: false };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const sum = (a) => a.reduce((n, x) => n + x.size, 0);
function split(b) {
  const u = ["B", "KB", "MB", "GB", "TB"];
  let v = b, i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return [i === 0 || v >= 100 ? v.toFixed(0) : v.toFixed(1), u[i]];
}
const fmt = (b) => split(b).join(" ");
const ageTxt = (d) => (d === 0 ? "Today" : d === 1 ? "Yesterday" : d < 30 ? `${d} days` : d < 365 ? `${Math.floor(d / 30)} mo` : `${Math.floor(d / 365)} yr`);

// SVG donut: segments [{ v, color }] drawn over a track, starting at 12 o'clock.
function donut(segs, total, size = 112, stroke = 12) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let off = 0, arcs = "";
  for (const s of segs) {
    const len = (s.v / total) * c;
    arcs += `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-linecap="butt"
      style="stroke-dasharray:${Math.max(len - 1.5, 1.5)} ${c};stroke-dashoffset:${-off}"/>`;
    off += len;
  }
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--card-2)" stroke-width="${stroke}"/>${arcs}</svg>`;
}

function renderOverview() {
  const dev = sum(items), used = DISK.total - DISK.free, other = used - dev;
  const [fv, fu] = split(DISK.free);
  $("#ring").innerHTML = donut([{ v: other, color: "var(--seg-other)" }, { v: dev, color: "var(--accent)" }], DISK.total)
    + `<div class="center"><b class="num">${fv} ${fu}</b><span>free</span></div>`;
  $("#disk-legend").innerHTML = `
    <li><i class="dot" style="background:var(--accent)"></i>Dev folders<b class="num">${fmt(dev)}</b></li>
    <li><i class="dot" style="background:var(--seg-other)"></i>Everything else<b class="num">${fmt(other)}</b></li>
    <li><i class="dot" style="background:var(--card-2)"></i>Free<b class="num">${fmt(DISK.free)}</b></li>`;

  const [rv, ru] = split(dev);
  $("#recl").innerHTML = `${rv}<small>${ru}</small>`;
  $("#recl-tag").textContent = `${items.length} folders · ${new Set(items.map((i) => i.project)).size} projects`;
  const byGroup = GROUPS.map((g) => ({ g, v: sum(items.filter((i) => i.group === g)) })).filter((x) => x.v > 0);
  $("#segbar").innerHTML = byGroup.map(({ g, v }) => `<i style="flex-grow:${v};background:${g.color}" title="${g.label} ${fmt(v)}"></i>`).join("");
  $("#kind-legend").innerHTML = byGroup.map(({ g, v }) => `<div><i class="dot" style="background:${g.color}"></i>${g.label}<b class="num">${fmt(v)}</b></div>`).join("");

  const idle = items.filter((i) => i.age >= 30);
  const [iv, iu] = split(sum(idle));
  $("#idle").innerHTML = `${iv}<small>${iu}</small>`;
  const buckets = [
    ["< 1 wk", (d) => d < 7, false], ["< 1 mo", (d) => d >= 7 && d < 30, false],
    ["1–6 mo", (d) => d >= 30 && d < 180, true], ["6 mo +", (d) => d >= 180, true],
  ].map(([label, test, isIdle]) => ({ label, isIdle, v: sum(items.filter((i) => test(i.age))) }));
  const max = Math.max(1, ...buckets.map((b) => b.v));
  $("#hist").innerHTML = buckets.map((b) => `<div class="col" title="${b.label}: ${fmt(b.v)}">
      <div class="bar${b.isIdle ? " idle" : ""}" style="height:${Math.max(4, (b.v / max) * 48)}px"></div><span class="lbl">${b.label}</span></div>`).join("");
  $("#sel-idle").disabled = !idle.length;
}

const shown = () => items
  .filter((i) => S.tab === "all" || i.group.id === S.tab)
  .sort((a, b) => (S.sort === "size" ? b.size - a.size : b.age - a.age));

function renderList() {
  const tabs = [{ id: "all", label: "All", n: items.length }, ...GROUPS.map((g) => ({ id: g.id, label: g.label, n: items.filter((i) => i.group === g).length, color: g.color }))]
    .filter((t) => t.id === "all" || t.n);
  $("#tabs").innerHTML = tabs.map((t) => `<button class="tab${S.tab === t.id ? " on" : ""}" data-tab="${t.id}">${t.color ? `<i class="dot" style="background:${t.color}"></i>` : ""}${t.label}<span class="n">${t.n}</span></button>`).join("");
  $("#sort").innerHTML = [["size", "Largest"], ["age", "Oldest"]].map(([k, l]) => `<button class="${S.sort === k ? "on" : ""}" data-sort="${k}">${l}</button>`).join("");

  const list = shown();
  const max = Math.max(1, ...items.map((i) => i.size));
  const nSel = list.filter((i) => S.sel.has(i.path)).length;
  $("#all").checked = list.length > 0 && nSel === list.length;
  $("#all").indeterminate = nSel > 0 && nSel < list.length;

  $("#rows").innerHTML = list.length ? list.map((i) => `
    <div class="row${S.sel.has(i.path) ? " sel" : ""}" data-path="${esc(i.path)}">
      <input type="checkbox" tabindex="-1"${S.sel.has(i.path) ? " checked" : ""}>
      <div class="name"><b>${esc(i.project)}</b><span class="mono" title="${esc(i.path)}">${esc(i.path)}</span></div>
      <div><span class="kind"><i class="dot" style="background:${i.group.color}"></i>${esc(i.kind)}</span></div>
      <div class="meter"><i style="width:${((i.size / max) * 100).toFixed(1)}%;background:${i.group.color}"></i></div>
      <span class="age${i.age >= 30 ? " old" : ""}">${ageTxt(i.age)}</span>
      <span class="size num r">${fmt(i.size)}</span>
    </div>`).join("")
    : `<div class="empty">${S.scanning ? "Looking for folders…" : "Nothing to clean here. Nice."}</div>`;

  const chosen = items.filter((i) => S.sel.has(i.path));
  $("#info").innerHTML = chosen.length
    ? `<b>${chosen.length}</b> selected · <b class="num">${fmt(sum(chosen))}</b> to free`
    : "Pick folders to free up space";
  $("#delete").disabled = !chosen.length;
}

function render() {
  $("#progress").hidden = !S.scanning;
  $("#scan").disabled = S.scanning;
  $("#scan-label").textContent = S.scanning ? "Scanning…" : "Scan";
  renderOverview();
  renderList();
}

function scan() {
  const all = load().sort(() => Math.random() - 0.5);
  items = []; S.sel.clear(); S.scanning = true;
  render();
  const t = setInterval(() => {
    items.push(all[items.length]);
    if (items.length === all.length) { clearInterval(t); S.scanning = false; }
    render();
  }, 55);
}

function askDelete() {
  const chosen = items.filter((i) => S.sel.has(i.path));
  if (!chosen.length) return;
  const how = [...new Set(chosen.map((i) => RECREATE[i.group.id]))];
  $("#c-title").textContent = `Delete ${chosen.length} folder${chosen.length > 1 ? "s" : ""}?`;
  $("#c-body").textContent = `They're removed permanently. Your code stays untouched, and you can bring them back with ${how.slice(0, 2).join(" or ")}${how.length > 2 ? " and the like" : ""}.`;
  $("#c-size").textContent = fmt(sum(chosen));
  $("#confirm").hidden = false;
  $("#c-ok").focus();
}
function closeConfirm() { $("#confirm").hidden = true; }
function doDelete() {
  const freed = sum(items.filter((i) => S.sel.has(i.path)));
  items = items.filter((i) => !S.sel.has(i.path));
  DISK.free += freed;
  S.sel.clear();
  closeConfirm();
  render();
  toast(`Freed ${fmt(freed)}`);
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>${esc(msg)}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), 2600);
}

$("#scan").onclick = scan;
$("#folder").onclick = () => toast("Opens the folder picker");
$("#delete").onclick = askDelete;
$("#c-cancel").onclick = closeConfirm;
$("#c-ok").onclick = doDelete;
$("#confirm").onclick = (e) => { if (e.target.id === "confirm") closeConfirm(); };
$("#sel-idle").onclick = () => {
  items.filter((i) => i.age >= 30).forEach((i) => S.sel.add(i.path));
  S.tab = "all"; S.sort = "age";
  render();
};
$("#all").onclick = () => {
  const list = shown();
  const allOn = list.every((i) => S.sel.has(i.path));
  list.forEach((i) => (allOn ? S.sel.delete(i.path) : S.sel.add(i.path)));
  render();
};
document.addEventListener("click", (e) => {
  let el;
  if ((el = e.target.closest("[data-tab]"))) { S.tab = el.dataset.tab; render(); }
  else if ((el = e.target.closest("[data-sort]"))) { S.sort = el.dataset.sort; render(); }
  else if ((el = e.target.closest(".row"))) {
    const p = el.dataset.path;
    S.sel.has(p) ? S.sel.delete(p) : S.sel.add(p);
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if ($("#confirm").hidden) return;
  if (e.key === "Escape") closeConfirm();
  if (e.key === "Enter") { e.preventDefault(); doDelete(); }
});

render();
</script>
</body>
</html>
